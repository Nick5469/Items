    <!-- viewport-fit=cover：让页面铺到屏幕边缘，env(safe-area-inset-*) 才有真实值。
         全面屏避让（顶部导航 + 每个页面首个组件的上边距）依赖它，见 App.css 的 --app-safe-top -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>quiz-app</title>
    <!-- 主题预置：必须在 React 挂载前同步执行。
         主题偏好存在 IndexedDB 里（异步），等 React 读到要好几帧，
         期间页面会先按默认值画一次——也就是每次刷新都闪一下浅色毛玻璃。
         这里直接读 localStorage 的镜像（App.jsx 的 writeThemeCache 维护），
         把三个维度的属性先写到 <html> 上，首帧就是用户选的主题。
         脚本失败（隐私模式禁用存储 / JSON 损坏）时什么都不做，
         React 挂载后会按数据库里的真实设置补上，只是会闪一下。 -->
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('app-theme-preferences');
          if (!raw) return;
          var prefs = JSON.parse(raw) || {};
          var root = document.documentElement;
          var dark = prefs.themeMode === 'dark' || (
            (prefs.themeMode === 'auto' || !prefs.themeMode) &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          );
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.setAttribute('data-theme-style', prefs.themeStyle || 'glass');
          if (prefs.accentColor) root.style.setProperty('--app-primary', prefs.accentColor);
        } catch (error) {
          /* 读不到镜像就交给 React，不影响启动 */
        }
      })();
    </script>
    <!-- 字号档位的首帧镜像：键名与 useFontScale 的 SCALE_CACHE_KEY 一致。
         单独一段而不是并进上面的主题脚本：主题镜像损坏时字号仍要生效，
         反过来也一样——两件事互不牵连。 -->
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('appFontScaleCache');
          if (!raw) return;
          var scale = parseFloat(raw);
          if (!isFinite(scale) || scale <= 0) return;
          document.documentElement.style.setProperty('--font-scale', String(scale));
        } catch (error) {
          /* 读不到镜像就交给 React，不影响启动 */
        }
      })();
    </script>
