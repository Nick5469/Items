<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebXR AR 核心空间能力演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: manipulation;
    }

    /* AR 按钮 */
    #ar-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 40px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
      transition: all 0.3s;
      z-index: 100;
    }
    
    #ar-button:active {
      transform: translateX(-50%) scale(0.95);
    }
    
    #ar-button:disabled {
      background: #555;
      box-shadow: none;
    }

    /* 状态指示器 */
    #status-bar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
    }

    .status-pill {
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      backdrop-filter: blur(10px);
      display: none;
    }
    
    .status-pill.active {
      display: block;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* DOM 叠加层 - 在 AR 视图上的 UI */
    #dom-overlay {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 12px;
      z-index: 200;
    }
    
    #dom-overlay.active {
      display: flex;
    }

    .overlay-btn {
      padding: 12px 20px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }

    .overlay-btn.danger {
      background: rgba(255,80,80,0.9);
      color: white;
    }

    /* 光照信息面板 */
    #light-info {
      position: fixed;
      top: 80px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 11px;
      display: none;
      z-index: 100;
      backdrop-filter: blur(10px);
      font-family: monospace;
    }
    
    #light-info.active {
      display: block;
    }
  </style>
</head>
<body>
  <!-- 进入 AR 按钮 -->
  <button id="ar-button" disabled>⏳ 检查 AR 支持...</button>

  <!-- 状态指示器 -->
  <div id="status-bar">
    <div class="status-pill" id="pill-plane">📐 平面已检测</div>
    <div class="status-pill" id="pill-hit">🎯 命中测试就绪</div>
    <div class="status-pill" id="pill-anchor">⚓ 锚点已创建</div>
    <div class="status-pill" id="pill-light">💡 光照已估计</div>
    <div class="status-pill" id="pill-depth">📏 深度感知</div>
  </div>

  <!-- DOM 叠加层按钮 -->
  <div id="dom-overlay">
    <button class="overlay-btn" id="btn-clear">🧹 清除所有</button>
    <button class="overlay-btn danger" id="btn-exit">✕ 退出 AR</button>
  </div>

  <!-- 光照信息 -->
  <div id="light-info"></div>

  <!-- 加载 Three.js 和 AR 模块 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { XREstimatedLight } from 'three/addons/webxr/XREstimatedLight.js';

    // ==================== 全局状态 ====================
    let scene, camera, renderer, light, directionalLight;
    let arSession = null;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let anchors = new Set();
    let placedObjects = [];
    let reticle;
    let estimatedLight;
    let defaultReferenceSpace;
    
    // 当前设备支持的 AR 特性
    const supportedFeatures = new Set();
    
    // ==================== 初始化 Three.js ====================
    async function init() {
      // 渲染器
      renderer = new THREE.WebGLRenderer({ 
        antialias: true, 
        alpha: true,
        preserveDrawingBuffer: true // 允许截图
      });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 场景
      scene = new THREE.Scene();
      
      // 相机
      camera = new THREE.PerspectiveCamera(
        70, 
        window.innerWidth / window.innerHeight, 
        0.01, 
        100
      );
      
      // 默认光照（AR 环境光照会覆盖）
      light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      scene.add(light);
      
      directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
      scene.add(directionalLight);

      // ---- 展示光照估计能力 ----
      estimatedLight = new XREstimatedLight(renderer);
      estimatedLight.addEventListener('estimationstart', () => {
        console.log('💡 光照估计已启动');
        // 替换默认光照
        scene.add(estimatedLight);
        scene.remove(light);
        scene.remove(directionalLight);
        showPill('pill-light');
      });
      
      estimatedLight.addEventListener('estimationend', () => {
        scene.add(light);
        scene.add(directionalLight);
        scene.remove(estimatedLight);
        hidePill('pill-light');
      });

      // ---- 创建 Reticle（放置指示器）----
      const reticleGeometry = new THREE.RingGeometry(0.08, 0.12, 32);
      reticleGeometry.rotateX(-Math.PI / 2);
      const reticleMaterial = new THREE.MeshBasicMaterial({
        color: 0x667eea,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.7
      });
      reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // ---- 检查 AR 支持并初始化按钮 ----
      await checkARSupport();
      
      // ---- 窗口大小调整 ----
      window.addEventListener('resize', onWindowResize);
    }

    // ==================== AR 支持检测 ====================
    async function checkARSupport() {
      const button = document.getElementById('ar-button');
      
      if (!navigator.xr) {
        button.textContent = '❌ 浏览器不支持 WebXR';
        return;
      }

      try {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (supported) {
          button.textContent = '🚀 进入 AR 体验';
          button.disabled = false;
          button.onclick = startAR;
        } else {
          button.textContent = '❌ 设备不支持 AR';
        }
      } catch (e) {
        button.textContent = '❌ AR 检测失败';
        console.error('AR 检测错误:', e);
      }
    }

    // ==================== 启动 AR 会话 ====================
    async function startAR() {
      const button = document.getElementById('ar-button');
      button.textContent = '⏳ 启动中...';
      button.disabled = true;

      // 请求所有可能的特性
      const sessionInit = {
        requiredFeatures: ['local-floor', 'hit-test'],
        optionalFeatures: [
          'anchors',
          'lighting-estimation',
          'depth-sensing',
          'dom-overlay'
        ]
      };

      // 添加 DOM 叠加层（如果支持）
      const overlay = document.getElementById('dom-overlay');
      if (overlay) {
        sessionInit.optionalFeatures.push('dom-overlay');
        sessionInit.domOverlay = { root: overlay };
      }

      try {
        arSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
        
        // ---- 记录支持的 AR 特性 ----
        console.log('✅ AR 会话已创建');
        console.log('📋 启用的特性:', arSession.enabledFeatures);
        
        arSession.enabledFeatures.forEach(f => supportedFeatures.add(f));
        
        // 更新状态指示器
        if (supportedFeatures.has('hit-test')) showPill('pill-hit');
        if (supportedFeatures.has('lighting-estimation')) showPill('pill-light');
        if (supportedFeatures.has('depth-sensing')) showPill('pill-depth');

        // ---- 设置命中测试 ----
        arSession.addEventListener('end', onSessionEnd);
        arSession.addEventListener('select', onSelect);
        arSession.addEventListener('inputsourceschange', onInputSourcesChange);

        // ---- 设置锚点 ----
        if (supportedFeatures.has('anchors')) {
          console.log('⚓ 锚点功能可用');
        }

        // ---- 设置深度感知 ----
        if (supportedFeatures.has('depth-sensing')) {
          console.log('📏 深度感知功能可用');
        }

        // ---- 连接到 Three.js 渲染器 ----
        await renderer.xr.setSession(arSession);
        
        // 获取参考空间
        defaultReferenceSpace = await arSession.requestReferenceSpace('local-floor');
        
        // 请求命中测试源
        if (supportedFeatures.has('hit-test')) {
          const viewerSpace = await arSession.requestReferenceSpace('viewer');
          hitTestSource = await arSession.requestHitTestSource({ space: viewerSpace });
          hitTestSourceRequested = true;
          console.log('🎯 命中测试源已创建');
        }

        // ---- 连接光照估计 ----
        if (supportedFeatures.has('lighting-estimation')) {
          estimatedLight.enable(arSession);
        }

        // ---- 绑定 DOM 叠加层按钮 ----
        document.getElementById('btn-clear').onclick = clearAllObjects;
        document.getElementById('btn-exit').onclick = () => arSession.end();
        
        // 显示 DOM 叠加层
        overlay.classList.add('active');
        
        button.textContent = '✅ AR 运行中';
        button.style.display = 'none';

      } catch (error) {
        console.error('❌ 启动 AR 失败:', error);
        button.textContent = '❌ 启动失败，请重试';
        button.disabled = false;
      }
    }

    // ==================== 会话结束 ====================
    function onSessionEnd() {
      console.log('🔚 AR 会话已结束');
      
      // 重置状态
      hitTestSource = null;
      hitTestSourceRequested = false;
      anchors.clear();
      placedObjects = [];
      reticle.visible = false;
      
      // 隐藏 UI
      document.getElementById('dom-overlay').classList.remove('active');
      document.querySelectorAll('.status-pill').forEach(p => p.classList.remove('active'));
      
      // 恢复按钮
      const button = document.getElementById('ar-button');
      button.textContent = '🚀 再次进入 AR';
      button.style.display = 'block';
      button.disabled = false;
    }

    // ==================== 输入源变化（检测交互方式） ====================
    function onInputSourcesChange(event) {
      event.added.forEach(source => {
        console.log('🖐️ 检测到输入源:', source.handedness || 'screen');
      });
    }

    // ==================== 选择事件（放置物体） ====================
    function onSelect(event) {
      if (!reticle.visible) {
        console.warn('⚠️ 未检测到平面，无法放置');
        return;
      }

      // 在 Reticle 位置创建物体
      const position = new THREE.Vector3();
      const quaternion = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      reticle.matrix.decompose(position, quaternion, scale);
      
      createObjectAtPosition(position, quaternion);
    }

    // ==================== 创建展示物体 ====================
    function createObjectAtPosition(position, quaternion) {
      // 随机选择物体类型
      const type = Math.floor(Math.random() * 3);
      let mesh;

      switch(type) {
        case 0: // 彩色立方体 - 展示基础3D渲染
          const geo1 = new THREE.BoxGeometry(0.1, 0.1, 0.1);
          const mat1 = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color().setHSL(Math.random(), 0.8, 0.5),
            roughness: 0.3,
            metalness: 0.5
          });
          mesh = new THREE.Mesh(geo1, mat1);
          mesh.name = 'cube';
          break;

        case 1: // 球体 - 展示光照反射
          const geo2 = new THREE.SphereGeometry(0.06, 32, 32);
          const mat2 = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color().setHSL(Math.random(), 0.9, 0.6),
            roughness: 0.2,
            metalness: 0.8
          });
          mesh = new THREE.Mesh(geo2, mat2);
          mesh.name = 'sphere';
          break;

        case 2: // 圆环 - 展示复杂几何体
          const geo3 = new THREE.TorusGeometry(0.05, 0.02, 16, 32);
          const mat3 = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
            roughness: 0.4,
            metalness: 0.3
          });
          mesh = new THREE.Mesh(geo3, mat3);
          mesh.name = 'torus';
          break;
      }

      // 设置位置和旋转
      mesh.position.copy(position);
      mesh.quaternion.copy(quaternion);
      
      // 添加浮动动画属性
      mesh.userData = {
        startY: position.y,
        floatOffset: Math.random() * Math.PI * 2,
        floatSpeed: 0.5 + Math.random() * 1.5,
        rotateSpeed: 0.3 + Math.random() * 1.0,
        createdAt: performance.now()
      };

      scene.add(mesh);
      placedObjects.push(mesh);

      // ---- 创建持久化锚点（如果支持）----
      if (supportedFeatures.has('anchors') && arSession) {
        createAnchor(position, quaternion);
      }

      console.log(`📦 已放置 ${mesh.name}，位置:`, position.toArray().map(v => v.toFixed(3)));
      showPill('pill-anchor');
      
      // 3秒后隐藏锚点指示器
      setTimeout(() => hidePill('pill-anchor'), 3000);
    }

    // ==================== 创建锚点 ====================
    async function createAnchor(position, quaternion) {
      try {
        // 创建锚点需要 XRAnchor 的 pose
        const anchorSpace = await defaultReferenceSpace;
        
        // 创建变换矩阵
        const transform = new XRRigidTransform(
          { x: position.x, y: position.y, z: position.z },
          { x: quaternion.x, y: quaternion.y, z: quaternion.z, w: quaternion.w }
        );
        
        const anchor = await arSession.createAnchor(transform, anchorSpace);
        anchors.add(anchor);
        
        console.log('⚓ 锚点已创建:', anchor);
        
        // 监听锚点更新
        anchor.addEventListener('update', () => {
          console.log('🔄 锚点位置已更新');
        });
        
      } catch (error) {
        console.warn('⚠️ 锚点创建失败:', error.message);
      }
    }

    // ==================== 清除所有物体 ====================
    function clearAllObjects() {
      placedObjects.forEach(obj => scene.remove(obj));
      placedObjects = [];
      
      // 删除所有锚点
      anchors.forEach(anchor => {
        try { anchor.delete(); } catch(e) {}
      });
      anchors.clear();
      
      console.log('🧹 已清除所有物体和锚点');
    }

    // ==================== 渲染循环 ====================
    function onXRFrame(time, frame) {
      if (!arSession) return;
      
      const session = frame.session;
      
      // ---- 1. 光照估计更新 ----
      if (supportedFeatures.has('lighting-estimation')) {
        estimatedLight.update(frame);
        
        // 显示光照信息
        if (estimatedLight.lightProbe) {
          const intensity = estimatedLight.lightProbe.intensity;
          const color = estimatedLight.primaryLightColor;
          updateLightInfo(intensity, color);
        }
      }

      // ---- 2. 命中测试（平面检测 + Reticle 更新） ----
      if (hitTestSourceRequested && frame) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        
        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(defaultReferenceSpace);
          
          if (pose) {
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            showPill('pill-plane');
          }
        } else {
          reticle.visible = false;
          hidePill('pill-plane');
        }
      }

      // ---- 3. 深度数据获取（如果可用） ----
      if (supportedFeatures.has('depth-sensing') && frame) {
        try {
          const depthInfo = frame.getDepthInformation();
          if (depthInfo) {
            showPill('pill-depth');
            // 实际应用中可以用于遮挡计算
            // 这里仅示意性地获取深度数据
            const width = depthInfo.width;
            const height = depthInfo.height;
            const depthData = depthInfo.data;
            
            // 获取中心点深度作为参考
            const centerX = Math.floor(width / 2);
            const centerY = Math.floor(height / 2);
            const centerDepth = depthInfo.getDepthInMeters(centerX, centerY);
            
            if (centerDepth !== null) {
              // 根据深度调整 Reticle 或其他逻辑
              // console.log('📏 中心深度:', centerDepth.toFixed(3), '米');
            }
          }
        } catch(e) {
          // 深度数据可能暂时不可用
        }
      }

      // ---- 4. 物体浮动动画 ----
      const now = performance.now() / 1000;
      placedObjects.forEach(obj => {
        if (obj.userData.floatOffset !== undefined) {
          obj.position.y = obj.userData.startY + 
            Math.sin(now * obj.userData.floatSpeed + obj.userData.floatOffset) * 0.01;
          obj.rotation.y += obj.userData.rotateSpeed * 0.01;
        }
      });

      // ---- 5. 渲染场景 ----
      renderer.render(scene, camera);
      
      // 请求下一帧
      session.requestAnimationFrame(onXRFrame);
    }

    // ==================== 辅助函数 ====================
    function showPill(id) {
      document.getElementById(id)?.classList.add('active');
    }

    function hidePill(id) {
      document.getElementById(id)?.classList.remove('active');
    }

    function updateLightInfo(intensity, color) {
      const panel = document.getElementById('light-info');
      if (!panel) return;
      
      panel.classList.add('active');
      
      const r = Math.round((color?.r || 1) * 255);
      const g = Math.round((color?.g || 1) * 255);
      const b = Math.round((color?.b || 1) * 255);
      
      panel.innerHTML = `
        💡 环境光强度: ${(intensity || 0).toFixed(2)}<br>
        🎨 主光色: rgb(${r},${g},${b})<br>
        <span style="display:inline-block;width:12px;height:12px;
          background:rgb(${r},${g},${b});border-radius:50%;margin-top:4px;"></span>
      `;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ==================== 启动 ====================
    init().then(() => {
      console.log('✅ AR 演示已就绪');
      console.log('📋 功能清单:');
      console.log('  🎯 命中测试 - 检测平面，显示 Reticle');
      console.log('  📐 平面检测 - 自动识别桌面/地面');
      console.log('  ⚓ 持久化锚点 - 锚定物体在真实空间');
      console.log('  💡 光照估计 - 真实光照渲染');
      console.log('  📏 深度感知 - 获取环境深度数据');
      console.log('  🖼️ DOM 叠加层 - AR 视图上的 HTML UI');
      console.log('  🎨 浮动动画 - 物体微动效果');
      console.log('  📱 多种3D几何体 - 展示渲染能力');
    });
  </script>
</body>
</html>
