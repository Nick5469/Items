<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebXR AR - 增强调试版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }

    #ar-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 40px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
      transition: all 0.3s;
      z-index: 100;
    }
    
    #ar-button:active { transform: translateX(-50%) scale(0.95); }
    #ar-button:disabled { background: #555; box-shadow: none; }

    /* 调试面板 */
    #debug-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0,0,0,0.85);
      color: #0f0;
      padding: 12px;
      border-radius: 12px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      z-index: 999;
      max-height: 200px;
      overflow-y: auto;
      backdrop-filter: blur(10px);
      display: none;
      line-height: 1.6;
    }
    
    #debug-panel.active { display: block; }
    
    .debug-good { color: #0f0; }
    .debug-warn { color: #ff0; }
    .debug-error { color: #f44; }
    .debug-info { color: #0af; }

    /* 提示信息 */
    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      text-align: center;
      z-index: 200;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      transition: opacity 0.5s;
    }

    /* Reticle 状态指示 */
    #reticle-status {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 100;
      display: none;
      backdrop-filter: blur(10px);
    }
    
    #reticle-status.active { display: block; }

    #dom-overlay {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 12px;
      z-index: 200;
    }
    
    #dom-overlay.active { display: flex; }

    .overlay-btn {
      padding: 12px 20px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      pointer-events: auto;
    }

    .overlay-btn.danger {
      background: rgba(255,80,80,0.9);
      color: white;
    }
  </style>
</head>
<body>
  <button id="ar-button" disabled>⏳ 检查 AR 支持...</button>
  
  <div id="debug-panel"></div>
  <div id="hint"></div>
  <div id="reticle-status">🔍 缓慢移动手机，扫描平面...</div>

  <div id="dom-overlay">
    <button class="overlay-btn" id="btn-clear">🧹 清除</button>
    <button class="overlay-btn danger" id="btn-exit">✕ 退出</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ==================== 调试日志 ====================
    const debugLines = [];
    function debug(msg, type = 'info') {
      const prefix = {
        'good': '✅ ',
        'warn': '⚠️ ',
        'error': '❌ ',
        'info': 'ℹ️ '
      }[type] || '';
      
      console.log(prefix + msg);
      debugLines.push({ msg: prefix + msg, type });
      
      const panel = document.getElementById('debug-panel');
      if (panel) {
        panel.classList.add('active');
        panel.innerHTML = debugLines.map(l => 
          `<span class="debug-${l.type}">${l.msg}</span>`
        ).join('<br>');
        panel.scrollTop = panel.scrollHeight;
      }
    }

    function showHint(text) {
      const hint = document.getElementById('hint');
      if (hint) {
        hint.textContent = text;
        hint.style.opacity = '1';
      }
    }

    function hideHint() {
      const hint = document.getElementById('hint');
      if (hint) hint.style.opacity = '0';
    }

    // ==================== 全局状态 ====================
    let scene, camera, renderer;
    let defaultLight, defaultDirectionalLight;
    let arSession = null;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let anchors = new Set();
    let placedObjects = [];
    let reticle;
    let defaultReferenceSpace;
    let planeDetectionStartTime = null;
    let planeDetectedEver = false;
    
    const supportedFeatures = new Set();

    // ==================== 初始化 ====================
    async function init() {
      // ---- 诊断检查 ----
      debug('=== 环境诊断 ===', 'info');
      debug(`协议: ${window.location.protocol}`, 
        window.location.protocol === 'https:' ? 'good' : 'error');
      debug(`navigator.xr: ${!!navigator.xr}`, 
        !!navigator.xr ? 'good' : 'error');
      
      if (!navigator.xr) {
        debug('WebXR 不可用，请使用 Chrome 浏览器', 'error');
        document.getElementById('ar-button').textContent = '❌ 需要 Chrome 浏览器';
        return;
      }

      try {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        debug(`immersive-ar 支持: ${supported}`, supported ? 'good' : 'error');
        
        if (!supported) {
          debug('设备不支持 AR，请检查：', 'warn');
          debug('  1. 是否安装了 Google Play Services for AR', 'warn');
          debug('  2. 设备是否在 ARCore 支持列表中', 'warn');
          document.getElementById('ar-button').textContent = '❌ 设备不支持 AR';
          return;
        }
      } catch(e) {
        debug('AR 检测失败: ' + e.message, 'error');
      }

      // ---- Three.js 初始化 ----
      renderer = new THREE.WebGLRenderer({ 
        antialias: true, 
        alpha: true,
        preserveDrawingBuffer: true
      });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(70, 
        window.innerWidth / window.innerHeight, 0.01, 100);
      
      // 默认光照
      defaultLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
      scene.add(defaultLight);
      defaultDirectionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      defaultDirectionalLight.position.set(1, 1, 1);
      scene.add(defaultDirectionalLight);

      // ---- Reticle（增强可视性） ----
      // 主圆环
      const ringGeo = new THREE.RingGeometry(0.08, 0.12, 64);
      ringGeo.rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x667eea,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.8
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      
      // 中心点
      const dotGeo = new THREE.CircleGeometry(0.02, 32);
      dotGeo.rotateX(-Math.PI / 2);
      const dotMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide
      });
      const dot = new THREE.Mesh(dotGeo, dotMat);
      
      // 组合 Reticle
      reticle = new THREE.Group();
      reticle.add(ring);
      reticle.add(dot);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // 启用按钮
      document.getElementById('ar-button').textContent = '🚀 进入 AR';
      document.getElementById('ar-button').disabled = false;
      document.getElementById('ar-button').onclick = startAR;
      
      window.addEventListener('resize', onWindowResize);
      debug('初始化完成，等待用户操作', 'good');
    }

    // ==================== 启动 AR ====================
    async function startAR() {
      const button = document.getElementById('ar-button');
      button.style.display = 'none';
      
      debug('正在启动 AR 会话...', 'info');

      const sessionInit = {
        requiredFeatures: ['local-floor', 'hit-test'],
        optionalFeatures: ['anchors', 'light-estimation', 'depth-sensing']
      };

      try {
        arSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
        
        debug('AR 会话已创建', 'good');
        debug(`启用特性: ${arSession.enabledFeatures?.join(', ') || '无'}`, 'info');
        
        arSession.enabledFeatures?.forEach(f => supportedFeatures.add(f));

        // 关键检查
        if (!supportedFeatures.has('hit-test')) {
          debug('设备不支持命中测试！这是检测不到平面的根本原因', 'error');
          debug('请确认 ARCore 已更新到最新版本', 'warn');
        } else {
          debug('命中测试功能已就绪', 'good');
        }

        // 监听会话事件
        arSession.addEventListener('end', onSessionEnd);
        arSession.addEventListener('select', onSelect);
        
        // 监听会话状态变化（检测跟踪质量）
        arSession.addEventListener('visibilitychange', (e) => {
          debug(`会话可见性: ${arSession.visibilityState}`, 'info');
        });

        // 设置渲染器
        await renderer.xr.setSession(arSession);
        
        // 获取参考空间
        defaultReferenceSpace = await arSession.requestReferenceSpace('local-floor');
        debug('参考空间: local-floor', 'good');

        // 创建命中测试源
        if (supportedFeatures.has('hit-test')) {
          // 注意：使用 'viewer' 空间作为命中测试源
          const viewerSpace = await arSession.requestReferenceSpace('viewer');
          hitTestSource = await arSession.requestHitTestSource({ 
            space: viewerSpace 
          });
          hitTestSourceRequested = true;
          debug('命中测试源已创建，类型: viewer-space', 'good');
        }

        // 显示 UI
        document.getElementById('dom-overlay').classList.add('active');
        document.getElementById('reticle-status').classList.add('active');
        
        // 显示扫描提示
        showHint('📱 缓慢移动手机\n对准桌面或地面');
        planeDetectionStartTime = performance.now();
        
        // 开始渲染
        arSession.requestAnimationFrame(onXRFrame);
        
        debug('AR 体验已启动！', 'good');
        debug('请缓慢移动手机对准平面...', 'info');

      } catch (error) {
        debug('启动失败: ' + error.message, 'error');
        console.error(error);
        button.style.display = 'block';
        button.textContent = '❌ 启动失败，重试';
        button.disabled = false;
      }
    }

    // ==================== 渲染循环 ====================
    function onXRFrame(time, frame) {
      if (!arSession) return;

      // ---- 1. 检查跟踪状态 ----
      const trackingState = frame.getViewerPose(defaultReferenceSpace);
      if (!trackingState) {
        // 跟踪丢失
        const elapsed = planeDetectionStartTime ? 
          ((performance.now() - planeDetectionStartTime) / 1000).toFixed(1) : 0;
        document.getElementById('reticle-status').textContent = 
          `⚠️ 跟踪丢失 (已等待${elapsed}s)... 请增加环境光线`;
        reticle.visible = false;
      }

      // ---- 2. 命中测试 ----
      let hitDetected = false;
      
      if (hitTestSourceRequested && hitTestSource && frame) {
        try {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(defaultReferenceSpace);
            
            if (pose) {
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
              hitDetected = true;
              
              if (!planeDetectedEver) {
                planeDetectedEver = true;
                const detectTime = ((performance.now() - planeDetectionStartTime) / 1000).toFixed(1);
                debug(`平面已检测到！耗时 ${detectTime}秒`, 'good');
                hideHint();
                document.getElementById('reticle-status').textContent = 
                  '✅ 平面已检测，点击放置物体';
              }
            }
          }
        } catch(e) {
          // 命中测试可能暂时失败
        }
      }

      if (!hitDetected && !planeDetectedEver) {
        reticle.visible = false;
        const elapsed = planeDetectionStartTime ? 
          ((performance.now() - planeDetectionStartTime) / 1000).toFixed(1) : 0;
        
        // 根据时间给出不同提示
        let statusText = '🔍 缓慢移动手机，扫描平面...';
        if (elapsed > 5) statusText = '💡 确保环境光线充足，对准纹理丰富的表面';
        if (elapsed > 10) statusText = '⚠️ 仍未检测到平面，请尝试：换个角度/增强光线/对准有纹理的地面';
        
        document.getElementById('reticle-status').textContent = statusText;
      }

      // ---- 3. 物体动画 ----
      const now = performance.now() / 1000;
      placedObjects.forEach(obj => {
        if (obj.userData.startY !== undefined) {
          obj.position.y = obj.userData.startY + 
            Math.sin(now * obj.userData.floatSpeed + obj.userData.floatOffset) * 0.01;
          obj.rotation.y += obj.userData.rotateSpeed * 0.01;
        }
      });

      // ---- 4. 渲染 ----
      renderer.render(scene, camera);
      arSession.requestAnimationFrame(onXRFrame);
    }

    // ==================== 放置物体 ====================
    function onSelect(event) {
      if (!reticle.visible) {
        debug('未检测到平面，无法放置', 'warn');
        return;
      }

      const position = new THREE.Vector3();
      const quaternion = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      reticle.matrix.decompose(position, quaternion, scale);
      
      // 创建物体
      const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
      const mat = new THREE.MeshStandardMaterial({ 
        color: new THREE.Color().setHSL(Math.random(), 0.8, 0.5),
        roughness: 0.3,
        metalness: 0.5
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(position);
      mesh.quaternion.copy(quaternion);
      mesh.userData = {
        startY: position.y,
        floatOffset: Math.random() * Math.PI * 2,
        floatSpeed: 0.5 + Math.random() * 1.5,
        rotateSpeed: 0.3 + Math.random()
      };
      
      scene.add(mesh);
      placedObjects.push(mesh);
      debug(`物体已放置在 (${position.x.toFixed(2)}, ${position.y.toFixed(2)}, ${position.z.toFixed(2)})`, 'good');

      // 创建锚点
      if (supportedFeatures.has('anchors') && arSession) {
        try {
          const transform = new XRRigidTransform(
            { x: position.x, y: position.y, z: position.z },
            { x: quaternion.x, y: quaternion.y, z: quaternion.z, w: quaternion.w }
          );
          arSession.createAnchor(transform, defaultReferenceSpace).then(anchor => {
            anchors.add(anchor);
            debug('锚点已创建', 'good');
          });
        } catch(e) {
          debug('锚点创建失败: ' + e.message, 'warn');
        }
      }
    }

    // ==================== 清理 ====================
    function clearAllObjects() {
      placedObjects.forEach(obj => scene.remove(obj));
      placedObjects = [];
      anchors.forEach(a => { try { a.delete(); } catch(e) {} });
      anchors.clear();
      debug('已清除所有物体', 'info');
    }

    function onSessionEnd() {
      debug('AR 会话结束', 'info');
      hitTestSource = null;
      hitTestSourceRequested = false;
      planeDetectedEver = false;
      planeDetectionStartTime = null;
      anchors.forEach(a => { try { a.delete(); } catch(e) {} });
      anchors.clear();
      clearAllObjects();
      reticle.visible = false;
      arSession = null;
      
      document.getElementById('dom-overlay').classList.remove('active');
      document.getElementById('reticle-status').classList.remove('active');
      hideHint();
      
      document.getElementById('ar-button').style.display = 'block';
      document.getElementById('ar-button').textContent = '🚀 再次进入 AR';
      document.getElementById('ar-button').disabled = false;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ==================== 启动 ====================
    init();
  </script>
</body>
</html>
