<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebXR AR 核心空间能力演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: manipulation;
    }

    #ar-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 40px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
      transition: all 0.3s;
      z-index: 100;
    }
    
    #ar-button:active {
      transform: translateX(-50%) scale(0.95);
    }
    
    #ar-button:disabled {
      background: #555;
      box-shadow: none;
    }

    #status-bar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
    }

    .status-pill {
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      backdrop-filter: blur(10px);
      display: none;
      white-space: nowrap;
    }
    
    .status-pill.active {
      display: block;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #dom-overlay {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 12px;
      z-index: 200;
    }
    
    #dom-overlay.active {
      display: flex;
    }

    .overlay-btn {
      padding: 12px 20px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }

    .overlay-btn.danger {
      background: rgba(255,80,80,0.9);
      color: white;
    }

    #light-info {
      position: fixed;
      top: 80px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 11px;
      display: none;
      z-index: 100;
      backdrop-filter: blur(10px);
      font-family: monospace;
      pointer-events: none;
    }
    
    #light-info.active {
      display: block;
    }

    /* 调试日志面板 */
    #debug-log {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 10px;
      font-family: monospace;
      max-height: 150px;
      overflow-y: auto;
      z-index: 300;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <button id="ar-button" disabled>⏳ 检查 AR 支持...</button>

  <div id="status-bar">
    <div class="status-pill" id="pill-plane">📐 平面已检测</div>
    <div class="status-pill" id="pill-hit">🎯 命中测试就绪</div>
    <div class="status-pill" id="pill-anchor">⚓ 锚点已创建</div>
    <div class="status-pill" id="pill-light">💡 光照已估计</div>
    <div class="status-pill" id="pill-depth">📏 深度感知</div>
  </div>

  <div id="dom-overlay">
    <button class="overlay-btn" id="btn-clear">🧹 清除所有</button>
    <button class="overlay-btn danger" id="btn-exit">✕ 退出 AR</button>
  </div>

  <div id="light-info"></div>
  <div id="debug-log"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { XREstimatedLight } from 'three/addons/webxr/XREstimatedLight.js';

    // ==================== 调试日志 ====================
    function debugLog(msg) {
      console.log(msg);
      const logEl = document.getElementById('debug-log');
      if (logEl) {
        logEl.style.display = 'block';
        logEl.innerHTML += msg + '<br>';
        logEl.scrollTop = logEl.scrollHeight;
      }
    }

    // ==================== 全局状态 ====================
    let scene, camera, renderer;
    let defaultLight, defaultDirectionalLight;
    let arSession = null;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let anchors = new Set();
    let placedObjects = [];
    let reticle;
    let estimatedLight = null;
    let lightEstimationEnabled = false;
    let defaultReferenceSpace;
    
    const supportedFeatures = new Set();
    
    // ==================== 初始化 Three.js ====================
    async function init() {
      renderer = new THREE.WebGLRenderer({ 
        antialias: true, 
        alpha: true,
        preserveDrawingBuffer: true
      });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(
        70, 
        window.innerWidth / window.innerHeight, 
        0.01, 
        100
      );
      
      // 默认光照（当光照估计不可用时使用）
      defaultLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(defaultLight);
      
      defaultDirectionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
      defaultDirectionalLight.position.set(1, 1, 1);
      scene.add(defaultDirectionalLight);

      // ---- 光照估计（延迟初始化） ----
      // 不在此时调用 enable()，等到 AR 会话创建后根据特性决定

      // ---- Reticle ----
      const reticleGeometry = new THREE.RingGeometry(0.08, 0.12, 32);
      reticleGeometry.rotateX(-Math.PI / 2);
      const reticleMaterial = new THREE.MeshBasicMaterial({
        color: 0x667eea,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.7
      });
      reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      await checkARSupport();
      window.addEventListener('resize', onWindowResize);
      
      debugLog('✅ 初始化完成，等待用户进入 AR');
    }

    // ==================== AR 支持检测 ====================
    async function checkARSupport() {
      const button = document.getElementById('ar-button');
      
      if (!navigator.xr) {
        button.textContent = '❌ 浏览器不支持 WebXR';
        debugLog('❌ navigator.xr 不可用');
        return;
      }

      try {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (supported) {
          button.textContent = '🚀 进入 AR 体验';
          button.disabled = false;
          button.onclick = startAR;
          debugLog('✅ 设备支持沉浸式 AR');
        } else {
          button.textContent = '❌ 设备不支持 AR';
          debugLog('❌ immersive-ar 不支持');
        }
      } catch (e) {
        button.textContent = '❌ AR 检测失败';
        debugLog('❌ 检测错误: ' + e.message);
      }
    }

    // ==================== 启动 AR 会话 ====================
    async function startAR() {
      const button = document.getElementById('ar-button');
      button.textContent = '⏳ 启动中...';
      button.disabled = true;

      // 请求所有可能的特性（每个都是可选的，除了 required）
      const sessionInit = {
        requiredFeatures: ['local-floor', 'hit-test'],
        optionalFeatures: [
          'anchors',
          'light-estimation',
          'depth-sensing',
          'dom-overlay'
        ]
      };

      // 添加 DOM 叠加层
      const overlay = document.getElementById('dom-overlay');
      if (overlay) {
        sessionInit.domOverlay = { root: overlay };
      }

      try {
        arSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
        
        debugLog('✅ AR 会话创建成功');
        debugLog('📋 启用的特性: ' + (arSession.enabledFeatures?.join(', ') || '无'));
        
        // 记录支持的特性
        arSession.enabledFeatures?.forEach(f => supportedFeatures.add(f));
        
        // 更新状态指示器
        if (supportedFeatures.has('hit-test')) showPill('pill-hit');
        if (supportedFeatures.has('light-estimation')) showPill('pill-light');
        if (supportedFeatures.has('depth-sensing')) showPill('pill-depth');

        // ---- 事件监听 ----
        arSession.addEventListener('end', onSessionEnd);
        arSession.addEventListener('select', onSelect);
        arSession.addEventListener('inputsourceschange', onInputSourcesChange);

        // ---- 设置 Three.js 渲染器（先设置，再处理光照） ----
        await renderer.xr.setSession(arSession);
        
        // 获取参考空间
        defaultReferenceSpace = await arSession.requestReferenceSpace('local-floor');
        
        // ---- 命中测试 ----
        if (supportedFeatures.has('hit-test')) {
          const viewerSpace = await arSession.requestReferenceSpace('viewer');
          hitTestSource = await arSession.requestHitTestSource({ space: viewerSpace });
          hitTestSourceRequested = true;
          debugLog('🎯 命中测试源已创建');
        }

        // ---- 光照估计（关键修复） ----
        // 只在会话明确支持 light-estimation 时才创建和启用
        if (supportedFeatures.has('light-estimation')) {
          try {
            estimatedLight = new XREstimatedLight(renderer);
            
            estimatedLight.addEventListener('estimationstart', () => {
              debugLog('💡 光照估计已启动 - 替换默认光照');
              // 移除默认光照
              scene.remove(defaultLight);
              scene.remove(defaultDirectionalLight);
              // 添加估计光照
              scene.add(estimatedLight);
              lightEstimationEnabled = true;
              showPill('pill-light');
            });
            
            estimatedLight.addEventListener('estimationend', () => {
              debugLog('💡 光照估计已停止 - 恢复默认光照');
              // 移除估计光照
              scene.remove(estimatedLight);
              // 恢复默认光照
              scene.add(defaultLight);
              scene.add(defaultDirectionalLight);
              lightEstimationEnabled = false;
              hidePill('pill-light');
              
              // 隐藏光照信息面板
              document.getElementById('light-info')?.classList.remove('active');
            });

            // 在 setSession 之后调用 enable
            await estimatedLight.enable(arSession);
            debugLog('✅ 光照估计已启用');
            
          } catch (lightError) {
            debugLog('⚠️ 光照估计启用失败: ' + lightError.message);
            estimatedLight = null;
            hidePill('pill-light');
          }
        } else {
          debugLog('ℹ️ 设备不支持光照估计，使用默认光照');
          estimatedLight = null;
        }

        // ---- 绑定 DOM 按钮 ----
        document.getElementById('btn-clear').onclick = clearAllObjects;
        document.getElementById('btn-exit').onclick = () => arSession.end();
        
        overlay.classList.add('active');
        button.style.display = 'none';
        
        // 开始渲染循环
        arSession.requestAnimationFrame(onXRFrame);
        
        debugLog('🚀 AR 体验已启动，请对准平面');

      } catch (error) {
        debugLog('❌ 启动 AR 失败: ' + error.message);
        console.error('启动 AR 详细错误:', error);
        button.textContent = '❌ 启动失败，请重试';
        button.disabled = false;
        
        // 清理可能部分创建的会话
        if (arSession) {
          try { arSession.end(); } catch(e) {}
          arSession = null;
        }
      }
    }

    // ==================== 会话结束 ====================
    function onSessionEnd() {
      debugLog('🔚 AR 会话已结束');
      
      // 清理光照估计
      if (estimatedLight && lightEstimationEnabled) {
        try {
          scene.remove(estimatedLight);
          scene.add(defaultLight);
          scene.add(defaultDirectionalLight);
        } catch(e) {}
        lightEstimationEnabled = false;
      }
      
      // 重置状态
      hitTestSource = null;
      hitTestSourceRequested = false;
      anchors.forEach(a => { try { a.delete(); } catch(e) {} });
      anchors.clear();
      placedObjects.forEach(obj => scene.remove(obj));
      placedObjects = [];
      reticle.visible = false;
      estimatedLight = null;
      arSession = null;
      
      // 隐藏 UI
      document.getElementById('dom-overlay')?.classList.remove('active');
      document.querySelectorAll('.status-pill').forEach(p => p.classList.remove('active'));
      document.getElementById('light-info')?.classList.remove('active');
      
      // 恢复按钮
      const button = document.getElementById('ar-button');
      button.textContent = '🚀 再次进入 AR';
      button.style.display = 'block';
      button.disabled = false;
    }

    // ==================== 输入源变化 ====================
    function onInputSourcesChange(event) {
      event.added.forEach(source => {
        debugLog('🖐️ 输入源: ' + (source.handedness || '触摸屏'));
      });
    }

    // ==================== 选择事件（放置物体） ====================
    function onSelect(event) {
      if (!reticle.visible) {
        debugLog('⚠️ 未检测到平面');
        return;
      }

      const position = new THREE.Vector3();
      const quaternion = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      reticle.matrix.decompose(position, quaternion, scale);
      
      createObjectAtPosition(position, quaternion);
    }

    // ==================== 创建展示物体 ====================
    function createObjectAtPosition(position, quaternion) {
      const type = Math.floor(Math.random() * 3);
      let mesh;

      switch(type) {
        case 0:
          const geo1 = new THREE.BoxGeometry(0.1, 0.1, 0.1);
          const mat1 = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color().setHSL(Math.random(), 0.8, 0.5),
            roughness: 0.3,
            metalness: 0.5
          });
          mesh = new THREE.Mesh(geo1, mat1);
          mesh.name = '立方体';
          break;

        case 1:
          const geo2 = new THREE.SphereGeometry(0.06, 32, 32);
          const mat2 = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color().setHSL(Math.random(), 0.9, 0.6),
            roughness: 0.2,
            metalness: 0.8
          });
          mesh = new THREE.Mesh(geo2, mat2);
          mesh.name = '球体';
          break;

        case 2:
          const geo3 = new THREE.TorusGeometry(0.05, 0.02, 16, 32);
          const mat3 = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
            roughness: 0.4,
            metalness: 0.3
          });
          mesh = new THREE.Mesh(geo3, mat3);
          mesh.name = '圆环';
          break;
      }

      mesh.position.copy(position);
      mesh.quaternion.copy(quaternion);
      
      mesh.userData = {
        startY: position.y,
        floatOffset: Math.random() * Math.PI * 2,
        floatSpeed: 0.5 + Math.random() * 1.5,
        rotateSpeed: 0.3 + Math.random() * 1.0,
        createdAt: performance.now()
      };

      scene.add(mesh);
      placedObjects.push(mesh);

      // 创建锚点
      if (supportedFeatures.has('anchors') && arSession) {
        createAnchor(position, quaternion);
      }

      debugLog(`📦 已放置 ${mesh.name}`);
      
      // 短暂显示锚点指示器
      showPill('pill-anchor');
      setTimeout(() => hidePill('pill-anchor'), 3000);
    }

    // ==================== 创建锚点 ====================
    async function createAnchor(position, quaternion) {
      try {
        const transform = new XRRigidTransform(
          { x: position.x, y: position.y, z: position.z },
          { x: quaternion.x, y: quaternion.y, z: quaternion.z, w: quaternion.w }
        );
        
        const anchor = await arSession.createAnchor(transform, defaultReferenceSpace);
        anchors.add(anchor);
        debugLog('⚓ 锚点已创建');
        
        anchor.addEventListener('update', () => {
          debugLog('🔄 锚点位置更新');
        });
        
      } catch (error) {
        debugLog('⚠️ 锚点创建失败: ' + error.message);
      }
    }

    // ==================== 清除所有物体 ====================
    function clearAllObjects() {
      placedObjects.forEach(obj => scene.remove(obj));
      placedObjects = [];
      
      anchors.forEach(anchor => {
        try { anchor.delete(); } catch(e) {}
      });
      anchors.clear();
      
      debugLog('🧹 已清除所有物体和锚点');
    }

    // ==================== 渲染循环 ====================
    function onXRFrame(time, frame) {
      if (!arSession) return;
      
      const session = frame.session;
      
      // ---- 1. 光照估计更新 ----
      if (lightEstimationEnabled && estimatedLight && supportedFeatures.has('light-estimation')) {
        try {
          const lightProbe = frame.getLightEstimate();
          if (lightProbe && estimatedLight.lightProbe) {
            estimatedLight.update(frame);
            updateLightInfo(
              estimatedLight.lightProbe.intensity,
              estimatedLight.primaryLightColor
            );
          }
        } catch(e) {
          // 光照估计可能暂时失败，忽略
        }
      }

      // ---- 2. 命中测试 ----
      if (hitTestSourceRequested && hitTestSource) {
        try {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(defaultReferenceSpace);
            
            if (pose) {
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
              showPill('pill-plane');
            }
          } else {
            reticle.visible = false;
            hidePill('pill-plane');
          }
        } catch(e) {
          reticle.visible = false;
        }
      }

      // ---- 3. 深度感知 ----
      if (supportedFeatures.has('depth-sensing')) {
        try {
          const depthInfo = frame.getDepthInformation();
          if (depthInfo) {
            showPill('pill-depth');
            const centerX = Math.floor(depthInfo.width / 2);
            const centerY = Math.floor(depthInfo.height / 2);
            const centerDepth = depthInfo.getDepthInMeters(centerX, centerY);
            // 可用于遮挡逻辑
          }
        } catch(e) {
          // 深度数据可能暂时不可用
        }
      }

      // ---- 4. 物体动画 ----
      const now = performance.now() / 1000;
      placedObjects.forEach(obj => {
        if (obj.userData.floatOffset !== undefined) {
          obj.position.y = obj.userData.startY + 
            Math.sin(now * obj.userData.floatSpeed + obj.userData.floatOffset) * 0.01;
          obj.rotation.y += obj.userData.rotateSpeed * 0.01;
        }
      });

      // ---- 5. 渲染 ----
      renderer.render(scene, camera);
      
      session.requestAnimationFrame(onXRFrame);
    }

    // ==================== 辅助函数 ====================
    function showPill(id) {
      document.getElementById(id)?.classList.add('active');
    }

    function hidePill(id) {
      document.getElementById(id)?.classList.remove('active');
    }

    function updateLightInfo(intensity, color) {
      const panel = document.getElementById('light-info');
      if (!panel) return;
      
      panel.classList.add('active');
      
      const r = Math.round((color?.r || 1) * 255);
      const g = Math.round((color?.g || 1) * 255);
      const b = Math.round((color?.b || 1) * 255);
      
      panel.innerHTML = `
        💡 强度: ${(intensity || 0).toFixed(2)}<br>
        🎨 色温: rgb(${r},${g},${b})
        <span style="display:inline-block;width:12px;height:12px;
          background:rgb(${r},${g},${b});border-radius:50%;vertical-align:middle;margin-left:4px;"></span>
      `;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ==================== 启动 ====================
    init().then(() => {
      debugLog('📋 检测到的核心能力将显示在顶部状态栏');
    });
  </script>
</body>
</html>
